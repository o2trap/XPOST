name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Proves the D1 migrations run with wrangler's own runner (local database, no Cloudflare account needed).
      - run: npm run db:migrate:local
      # Bundles the Worker as a deploy would, without deploying.
      - run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-dry
